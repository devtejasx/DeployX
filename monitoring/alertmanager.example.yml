# Alertmanager routing for DeployX alerts (example: fill in your own
# receivers, and keep their secrets in files, not here).
#
#   critical -> PagerDuty and Slack
#   warning  -> Slack, plus a daily email digest
#
# Validate with:  amtool check-config alertmanager.example.yml
route:
  receiver: slack
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: pagerduty
      continue: true
    - matchers: [severity="critical"]
      receiver: slack
    - matchers: [severity="warning"]
      receiver: slack
      continue: true
    - matchers: [severity="warning"]
      receiver: email
      group_interval: 24h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/slack-webhook-url
        channel: "#deployx-alerts"
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }} {{ end }}"
        send_resolved: true

  - name: pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/pagerduty-routing-key
        send_resolved: true

  - name: email
    email_configs:
      - to: ops@example.com
        from: deployx-alerts@example.com
        smarthost: smtp.example.com:587
        auth_username: deployx-alerts@example.com
        auth_password_file: /etc/alertmanager/smtp-password
