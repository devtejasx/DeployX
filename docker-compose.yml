# DeployX local development stack.
#
#   docker compose up --build      # everything (runs migrations first)
#   docker compose up -d postgres redis   # infrastructure only
#   docker compose run --rm migrate       # apply migrations on demand
#
# Values come from .env when it exists; the defaults below match .env.example.
#
# Apps deployed by DeployX are NOT part of this file: the worker starts them
# through Docker on a separate "deployx-apps" network (see README, Phase 4).
# Remove them with:
#   docker rm -f $(docker ps -aq --filter label=deployx.managed=true)

name: deployx

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deployx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deployx}
      POSTGRES_DB: ${POSTGRES_DB:-deployx}
    # Published on 127.0.0.1 only: reachable from this machine, not the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password required: an unauthenticated Redis would let anything that can
    # reach it inject or alter deployment jobs.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-deployx-dev-redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies pending database migrations, then exits.
  migrate:
    build: ./server
    command: ["node", "src/db/migrate.js", "up"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deployx}:${POSTGRES_PASSWORD:-deployx}@postgres:5432/${POSTGRES_DB:-deployx}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-deployx}:${POSTGRES_PASSWORD:-deployx}@postgres:5432/${POSTGRES_DB:-deployx}
      REDIS_URL: redis://:${REDIS_PASSWORD:-deployx-dev-redis}@redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-deployx}
      DEPLOYMENT_JOB_ATTEMPTS: ${DEPLOYMENT_JOB_ATTEMPTS:-3}
      DEPLOYMENT_JOB_BACKOFF_MS: ${DEPLOYMENT_JOB_BACKOFF_MS:-2000}
      # Verifies GitHub webhook signatures; only the API gets it.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  client:
    build: ./client
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:5000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-deployx}:${POSTGRES_PASSWORD:-deployx}@postgres:5432/${POSTGRES_DB:-deployx}
      REDIS_URL: redis://:${REDIS_PASSWORD:-deployx-dev-redis}@redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-deployx}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-25000}
      DEPLOYX_APP_NETWORK: ${DEPLOYX_APP_NETWORK:-deployx-apps}
      DOCKER_BUILD_TIMEOUT_MS: ${DOCKER_BUILD_TIMEOUT_MS:-600000}
      CONTAINER_STARTUP_GRACE_MS: ${CONTAINER_STARTUP_GRACE_MS:-3000}
      APP_MEMORY_LIMIT: ${APP_MEMORY_LIMIT:-512m}
      APP_CPU_LIMIT: ${APP_CPU_LIMIT:-1}
      # Health checks go to the app's port published on the Docker host, which
      # this container reaches as host.docker.internal (see extra_hosts).
      HEALTH_CHECK_HOST: host.docker.internal
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-2000}
      HEALTH_CHECK_INTERVAL_MS: ${HEALTH_CHECK_INTERVAL_MS:-2000}
      HEALTH_CHECK_RETRIES: ${HEALTH_CHECK_RETRIES:-5}
      HEALTH_CHECK_STARTUP_GRACE_MS: ${HEALTH_CHECK_STARTUP_GRACE_MS:-5000}
      HEALTH_CHECK_ALLOW_PRIVATE_URLS: ${HEALTH_CHECK_ALLOW_PRIVATE_URLS:-false}
      # Private repositories (optional GitHub App); only the worker gets the key.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # AWS deployments (optional). Credentials are passed through from the
      # environment Compose runs in, never written here.
      AWS_REGION: ${AWS_REGION:-}
      AWS_ECR_REPOSITORY: ${AWS_ECR_REPOSITORY:-}
      AWS_ECS_CLUSTER: ${AWS_ECS_CLUSTER:-}
      AWS_ECS_DEPLOY_TIMEOUT_MS: ${AWS_ECS_DEPLOY_TIMEOUT_MS:-600000}
      AWS_ECS_POLL_INTERVAL_MS: ${AWS_ECS_POLL_INTERVAL_MS:-10000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # DEVELOPMENT ONLY: the worker drives the host's Docker daemon to build
    # images and start app containers. Access to this socket is equivalent to
    # root on the Docker host, so ONLY the worker gets it - never the API,
    # never deployed apps. See "Security limitations" in the README.
    # (A filtering socket proxy was evaluated; it blocks BuildKit's gRPC
    # session, so builds could not run through it.)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The worker runs as the unprivileged "node" user; this adds the group
    # that owns the socket (0 on Docker Desktop, usually "docker" on Linux:
    # set DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)).
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Give running jobs time to finish on `docker compose stop` (default is 10s).
    stop_grace_period: 30s

volumes:
  postgres-data:
  redis-data:
