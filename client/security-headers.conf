# Security headers of the dashboard; the same policy as SECURITY_HEADERS in
# vite.config.js. Included in every location (nginx does not inherit
# add_header into a location that sets its own).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Served over HTTPS (behind the load balancer) in production.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
